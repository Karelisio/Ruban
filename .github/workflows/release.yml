name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RUBAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RUBAN_KEYSTORE_BASE64 manquant : impossible de signer la release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ruban.jks"
          echo "RUBAN_KEYSTORE_PATH=$RUNNER_TEMP/ruban.jks" >> "$GITHUB_ENV"

      - name: Tests and signed release build
        env:
          RUBAN_KEYSTORE_PASSWORD: ${{ secrets.RUBAN_KEYSTORE_PASSWORD }}
          RUBAN_KEY_ALIAS: ${{ secrets.RUBAN_KEY_ALIAS }}
          RUBAN_KEY_PASSWORD: ${{ secrets.RUBAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
          cp app/build/outputs/apk/release/app-release.apk "Ruban-${GITHUB_REF_NAME}.apk"

      - name: Changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}${GITHUB_REF_NAME}
          {
            echo "## Nouveautés"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s' | grep -v -E '^- (Merge|chore|ci)' || true
            echo
            echo
            echo "_versionCode ${VERSION_CODE}_"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Ruban ${{ env.VERSION_NAME }}
          body_path: CHANGELOG_RELEASE.md
          files: Ruban-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
