name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Manual release: creates the tag vX.Y.Z on the selected commit.
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="${INPUT_VERSION#v}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "TAG=v$V" >> "$GITHUB_ENV"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RUBAN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RUBAN_KEYSTORE_BASE64 manquant : impossible de signer la release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ruban.jks"
          echo "RUBAN_KEYSTORE_PATH=$RUNNER_TEMP/ruban.jks" >> "$GITHUB_ENV"

      - name: Tests and signed release build
        env:
          RUBAN_KEYSTORE_PASSWORD: ${{ secrets.RUBAN_KEYSTORE_PASSWORD }}
          RUBAN_KEY_ALIAS: ${{ secrets.RUBAN_KEY_ALIAS }}
          RUBAN_KEY_PASSWORD: ${{ secrets.RUBAN_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | head -5
          cp app/build/outputs/apk/release/app-release.apk "Ruban-${TAG}.apk"

      - name: Changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 --exclude "$TAG" HEAD 2>/dev/null || true)
          RANGE=${PREVIOUS:+$PREVIOUS..}HEAD
          {
            echo "## Nouveautés"
            echo
            git log "$RANGE" --no-merges --pretty=format:'- %s' | grep -v -E '^- (Merge|chore|ci)' || true
            echo
            echo
            echo "_versionCode ${VERSION_CODE}_"
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Ruban ${{ env.VERSION_NAME }}
          body_path: CHANGELOG_RELEASE.md
          files: Ruban-${{ env.TAG }}.apk
          fail_on_unmatched_files: true
